
name: Compiler Virus Metamorphose

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        run: make

      - name: Verifier
        run: ls -lh VirusMetamorphose.nds

      - name: Publier la ROM
        uses: actions/upload-artifact@v4
        with:
          name: VirusMetamorphose-DS
          path: VirusMetamorphose.nds

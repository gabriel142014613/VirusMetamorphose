
name: Compiler Virus Metamorphose

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Docker et compiler
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            devkitpro/devkitarm:latest \
            bash -c "make"

      - name: Verifier la ROM
        run: |
          test -f VirusMetamorphose.nds
          ls -lh VirusMetamorphose.nds

      - name: Telecharger la ROM
        uses: actions/upload-artifact@v4
        with:
          name: VirusMetamorphose-DS
          path: VirusMetamorphose.nds
